[package]
name = "velora_os"
version = "0.1.0"
edition = "2024"
authors = ["MensahPrince <codemesh4@mail.com>"]

[[bin]]
name = "velora_os"
test = true
bench = false

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"]}
volatile = "0.2.6"
spin = "0.5.2"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
x86_64 = "0.14.2"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
crossbeam-queue = { version = "0.3.11", default-features = false, features = ["alloc"] }
conquer-once = { version = "0.4.0", default-features = false }
futures-util = { version = "0.3.4", default-features = false, features = ["alloc"] }


[package.metadata.bootimage]
# The second drive here (primary-bus slave, see src/ata.rs's `Drive`) is
# the FAT16 filesystem disk build.rs assembles from disk/echo.s — deliberately
# left off test-args below, so `cargo test` keeps working even before
# `fs.img` exists (its QEMU boots from the primary drive only). `index=1`
# pins it to that slave position rather than trusting `-drive` ordering.
run-args = [
    "-drive", "format=raw,file=fs.img,if=ide,index=1"
]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout =  300


[[test]]
name = "stack_overflow"
harness = false
