[package]
name = "velora_os"
version = "0.1.0"
edition = "2024"
authors = ["MensahPrince <codemesh4@mail.com>"]

[unstable]
panic-abort-tests = true 

[[bin]]
name = "velora_os"
test = true
bench = false

[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
x86_64 = "0.14.2"
uart_16550 = "0.2.0"



[package.metadata.bootimage]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33 
test-timeout =  300

